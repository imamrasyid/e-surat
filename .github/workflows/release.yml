name: release

# Build image immutable per tag. Rollout ke server perusahaan dilakukan manual
# mengikuti docs/runbook-docker-frankenphp.md; workflow ini tidak menyentuh server.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release:
        description: "Tag rilis yang sudah ada, mis. v1.4.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.release || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ inputs.release || github.ref_name }}

    steps:
      - name: Validate release tag
        run: |
          if ! printf '%s' "$RELEASE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release harus berupa tag v<major>.<minor>.<patch>." >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release || github.ref_name }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Setup application
        run: composer setup

      - name: Run CI checks
        run: composer ci:check

      - name: Audit dependencies
        run: |
          composer audit --locked --no-dev
          npm audit --omit=dev --audit-level=high

  image:
    name: build + push image
    needs: quality
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ inputs.release || github.ref_name }}

    steps:
      - name: Validate release tag
        run: |
          if ! printf '%s' "$RELEASE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release harus berupa tag v<major>.<minor>.<patch>." >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release || github.ref_name }}
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Build and push image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker build \
            --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$RELEASE" \
            .
          docker push "$IMAGE:$RELEASE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$RELEASE")"
          printf 'Image: `%s`\n\nDigest: `%s`\n\nCommit: `%s`\n' "$IMAGE:$RELEASE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
